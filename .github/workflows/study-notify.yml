name: Study Notifications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-lates
    steps:
      - name: Send study notifications
        env:
          VAPID_PUBLIC:  ${{ vars.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_EMAIL:   noah@flouty.uk
          SB_URL:        ${{ vars.SB_URL }}
          SB_KEY:        ${{ secrets.SB_KEY }}
        run: |
          npm install --silent web-push
          node << 'SCRIPT'
          const webpush = require('web-push');

          const SB_URL = process.env.SB_URL;
          const SB_KEY = process.env.SB_KEY;
          const HDR = {
            'apikey': SB_URL ? SB_KEY : '',
            'Authorization': 'Bearer ' + SB_KEY,
            'Content-Type': 'application/json'
          };

          webpush.setVapidDetails(
            'mailto:' + process.env.VAPID_EMAIL,
            process.env.VAPID_PUBLIC,
            process.env.VAPID_PRIVATE
          );

          // ‚îÄ‚îÄ Supabase helpers ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
          async function sbGet(key) {
            try {
              const r = await fetch(`${SB_URL}/rest/v1/study_data?key=eq.${key}&select=value`, { headers: HDR });
              if (!r.ok) { console.error('sbGet ' + key + ' failed: ' + r.status); return null; }
              const rows = await r.json();
              if (!rows || !rows[0]) return null;
              const val = rows[0].value;
              if (typeof val === 'string') { try { return JSON.parse(val); } catch(e) { return val; } }
              return val;
            } catch(e) { console.error('sbGet error:', e.message); return null; }
          }

          async function sbSet(key, val) {
            try {
              await fetch(`${SB_URL}/rest/v1/study_data`, {
                method: 'POST',
                headers: { ...HDR, 'Prefer': 'resolution=merge-duplicates' },
                body: JSON.stringify({ key, value: JSON.stringify(val), updated_at: new Date().toISOString() })
              });
            } catch(e) {}
          }

          // ‚îÄ‚îÄ Utilities ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
          function toMins(t) {
            if (!t) return 0;
            const [h, m] = t.split(':');
            return parseInt(h) * 60 + parseInt(m || 0);
          }

          function fmtH(h) {
            const tot = Math.round(h * 60);
            const hrs = Math.floor(tot / 60);
            const mins = tot % 60;
            if (hrs && mins) return `${hrs}h ${mins}m`;
            if (hrs) return `${hrs}h`;
            return `${mins}m`;
          }

          // ‚îÄ‚îÄ Send helper ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
          async function send(sub, title, body, tag, extra={}) {
            try {
              await webpush.sendNotification(sub, JSON.stringify({
                title, body, tag, url: '/studytrack/', ...extra
              }));
              console.log(`‚úì [${tag}] ${title} ‚Äî ${body}`);
            } catch(e) {
              console.error(`‚úó [${tag}] ${e.statusCode || e.message}`);
            }
          }

          // ‚îÄ‚îÄ Main ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
          (async () => {
            // Current time in Perth (AWST UTC+8)
            const nowDate = new Date(new Date().toLocaleString('en-US', { timeZone: 'Australia/Perth' }));
            const dow     = nowDate.getDay();
            const nowMins = nowDate.getHours() * 60 + nowDate.getMinutes();
            const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            console.log(`${DAY[dow]} ${nowDate.toLocaleTimeString()} (${nowMins}m)`);

            // Is current time within a window around target?
            function near(targetMins, lo=2, hi=5) {
              return nowMins >= targetMins - lo && nowMins < targetMins + hi;
            }

            // Fetch everything in parallel
            const [schedule, subjectsRaw, sessionsRaw, hoursRaw, subsRaw, notifDone, todosRaw] = await Promise.all([
              sbGet('st_sched'),
              sbGet('st_subjs'),
              sbGet('st_sessions'),
              sbGet('st_hours'),
              sbGet('push_subscriptions'),
              sbGet('notif_done_subjs'),
              sbGet('st_todos')
            ]);

            if (!subsRaw) { console.log('No push subscriptions'); return; }
            const subs = Array.isArray(subsRaw) ? subsRaw : [subsRaw];
            console.log(`Sending to ${subs.length} device(s)`);

            // Helper: send to ALL subscribed devices
            async function sendAll(title, body, tag, extra={}) {
              for (const sub of subs) {
                await send(sub, title, body, tag, extra);
              }
            }

            const todayBlocks = (schedule || [])
              .filter(b => b.day === dow)
              .sort((a, b) => toMins(a.start) - toMins(b.start));

            const subjects  = subjectsRaw  || [];
            const sessions  = sessionsRaw  || [];
            const hours     = hoursRaw     || {};

            // Helper: total logged for a subject
            function getLogged(id) {
              const s = subjects.find(x => x.id === id);
              if (!s) return 0;
              return (s.base || 0) + (hours[id] || 0) +
                sessions.filter(x => x.subjectId === id).reduce((a, x) => a + x.hours, 0);
            }

            // Today's total hours
            const todayStr = nowDate.toISOString().slice(0, 10);
            const todayH = sessions.filter(s => s.date === todayStr).reduce((a, s) => a + s.hours, 0);

            // Weekly hours (last 7 days)
            const weekAgo = new Date(nowDate); weekAgo.setDate(weekAgo.getDate() - 6);
            const weekH = sessions
              .filter(s => new Date(s.date) >= weekAgo)
              .reduce((a, s) => a + s.hours, 0);

            // Weekly avg over last 4 weeks
            const monthAgo = new Date(nowDate); monthAgo.setDate(monthAgo.getDate() - 28);
            const monthH = sessions
              .filter(s => new Date(s.date) >= monthAgo)
              .reduce((a, s) => a + s.hours, 0);
            const weeklyAvg = monthH / 4;

            // Daily goal (default 6.3h)
            const dailyGoal = 6.3;
            const weeklyGoal = 44;

            // ‚îÄ‚îÄ 1a. Block starting in 5‚Äì15 min ‚Äî heads up ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
            const startingSoon = todayBlocks.filter(b =>
              b.type === 'study' &&
              toMins(b.start) - nowMins >= 5 &&
              toMins(b.start) - nowMins <= 15
            );
            for (const bl of startingSoon) {
              const minsAway = toMins(bl.start) - nowMins;
              await sendAll(
                `üìö Starting in ${minsAway}min`,
                `${bl.label} ¬∑ ${bl.start}‚Äì${bl.end}`,
                `soon-${bl.id}`
              );
            }

            // ‚îÄ‚îÄ 1b. Block just started (0‚Äì4 min ago) ‚Äî Start Timer ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
            const justStarted = todayBlocks.filter(b =>
              b.type === 'study' &&
              nowMins >= toMins(b.start) &&
              nowMins < toMins(b.start) + 5
            );
            for (const bl of justStarted) {
              await sendAll(
                `üü¢ Time to study ‚Äî ${bl.label}`,
                `${bl.start}‚Äì${bl.end} ¬∑ Tap to start your timer`,
                `started-${bl.id}`,
                { type: 'block-start', subjectId: bl.subjectId || null, blockStart: bl.start }
              );
            }

            // ‚îÄ‚îÄ 2. Study block ending in 5 min ‚Äî log reminder ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
            const endingSoon = todayBlocks.filter(b =>
              b.type === 'study' &&
              toMins(b.end) - nowMins >= 3 &&
              toMins(b.end) - nowMins <= 8
            );
            for (const bl of endingSoon) {
              await sendAll(
                `‚è± ${bl.label} ending soon`,
                `Finishes at ${bl.end} ¬∑ Don't forget to log your session!`,
                `end-${bl.id}`,
                { type: 'block-end', subjectId: bl.subjectId || null, blockStart: bl.start }
              );
            }

            // ‚îÄ‚îÄ 3. Break ending in 2 min ‚Äî next block preview ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
            const breakEndingSoon = todayBlocks.filter(b =>
              b.type === 'break' &&
              toMins(b.end) - nowMins >= 0 &&
              toMins(b.end) - nowMins <= 5
            );
            for (const bl of breakEndingSoon) {
              const nextBlock = todayBlocks.find(b => toMins(b.start) >= toMins(bl.end) && b.type === 'study');
              await sendAll(
                '‚òï Break ending soon',
                nextBlock ? `Up next: ${nextBlock.label} at ${nextBlock.start}` : 'Break wrapping up',
                `break-end-${bl.id}`
              );
            }

            // ‚îÄ‚îÄ 4. Morning summary ‚Äî 8:30am (split into 2 notifications) ‚îÄ‚îÄ
            if (near(8 * 60 + 30)) {
              const studyBlocks = todayBlocks.filter(b => b.type === 'study');
              const allBlocks   = todayBlocks.filter(b => b.type === 'study' || b.type === 'break');
              const scheduledH  = studyBlocks.reduce((a, b) => a + (toMins(b.end) - toMins(b.start)) / 60, 0);

              if (studyBlocks.length === 0) {
                await sendAll( 'üåÖ Good morning!', 'No study blocks scheduled today ¬∑ rest up!', 'morning-summary');
              } else {
                // Notification 1: schedule overview
                const blockLines = allBlocks
                  .map(b => `${b.type === 'break' ? '‚òï' : 'üìñ'} ${b.start}‚Äì${b.end} ${b.label}`)
                  .join('\n');
                await sendAll(
                  `üåÖ Good morning! ${studyBlocks.length} blocks today ¬∑ ${fmtH(scheduledH)}`,
                  blockLines,
                  'morning-schedule'
                );

                // Notification 2: subject focus ‚Äî most behind subjects
                const subjectStats = subjects
                  .filter(s => !s.done && !s.passive && s.req > 0)
                  .map(s => {
                    const logged = getLogged(s.id);
                    const pct = logged / s.req * 100;
                    const left = Math.max(0, s.req - logged);
                    return { ...s, logged, pct, left };
                  })
                  .sort((a, b) => a.pct - b.pct);

                const top3 = subjectStats.slice(0, 3);
                const focusBody = top3
                  .map(s => `${s.name} ¬∑ ${Math.round(s.pct)}% ¬∑ ${fmtH(s.left)} left`)
                  .join('\n');

                // Check if any on today's schedule
                const todaySubjectIds = studyBlocks.map(b => b.subjectId).filter(Boolean);
                const todayScheduled = subjectStats
                  .filter(s => todaySubjectIds.includes(s.id))
                  .map(s => s.name);

                const focusTitle = todayScheduled.length
                  ? `üéØ Today: ${todayScheduled.join(', ')}`
                  : 'üéØ Most behind subjects';

                await sendAll( focusTitle, focusBody, 'morning-focus');
              }
            }

            // ‚îÄ‚îÄ 5. Daily wrap-up ‚Äî 6pm ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
            if (near(18 * 60)) {
              const remaining = Math.max(0, dailyGoal - todayH);
              const body = todayH >= dailyGoal
                ? `‚úì Target hit! You studied ${fmtH(todayH)} today üéâ`
                : `${fmtH(todayH)} logged ¬∑ ${fmtH(remaining)} to hit today's target`;
              await sendAll( 'üìä Daily wrap-up', body, 'daily-wrapup');
            }

            // ‚îÄ‚îÄ 6. Monday morning ‚Äî weekly preview ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
            if (dow === 1 && near(8 * 60)) {
              await sendAll(
                'üìÖ New week!',
                `Goal: ${fmtH(weeklyGoal)} this week ¬∑ You averaged ${fmtH(weeklyAvg)}/week recently`,
                'monday-preview'
              );
            }

            // ‚îÄ‚îÄ 8. Sunday evening ‚Äî weekly recap ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
            if (dow === 0 && near(18 * 60)) {
              const hitTarget = sessions
                .filter(s => {
                  const d = new Date(s.date);
                  return d >= weekAgo && d <= nowDate;
                })
                .reduce((map, s) => { map[s.date] = (map[s.date] || 0) + s.hours; return map; }, {});
              const daysHit = Object.values(hitTarget).filter(h => h >= dailyGoal).length;
              await sendAll(
                'üìÜ Weekly recap',
                `${fmtH(weekH)} this week ¬∑ ${daysHit}/7 days hit target`,
                'weekly-recap'
              );
            }

            // ‚îÄ‚îÄ 9. Subject complete ‚Äî first time only ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
            const alreadyNotified = notifDone || [];
            const newlyDone = subjects.filter(s =>
              s.done && !alreadyNotified.includes(s.id)
            );
            for (const s of newlyDone) {
              await sendAll(
                'üéâ Subject complete!',
                `${s.name} is done ¬∑ Great work!`,
                `done-${s.id}`
              );
            }
            if (newlyDone.length) {
              await sbSet('notif_done_subjs', [...alreadyNotified, ...newlyDone.map(s => s.id)]);
            }

            // ‚îÄ‚îÄ 10. Subject behind ‚Äî once a day at 9am ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
            if (near(9 * 60)) {
              const avgPct = subjects
                .filter(s => !s.done && s.req > 0)
                .reduce((a, s) => a + getLogged(s.id) / s.req, 0) /
                Math.max(1, subjects.filter(s => !s.done && s.req > 0).length) * 100;

              const wayBehind = subjects
                .filter(s => !s.done && !s.passive && s.req > 0)
                .map(s => ({ ...s, pct: getLogged(s.id) / s.req * 100 }))
                .filter(s => s.pct < avgPct - 15)
                .sort((a, b) => a.pct - b.pct)
                .slice(0, 3);

              if (wayBehind.length) {
                await sendAll(
                  '‚ö†Ô∏è Subjects falling behind',
                  wayBehind.map(s => `${s.name} (${Math.round(s.pct)}%)`).join(' ¬∑ '),
                  'behind-subjects'
                );
              }
            }
            // To-Do reminders
            const todos = todosRaw || [];
            for (const t of todos.filter(t => !t.done && t.date && t.time)) {
              const [tHour, tMin] = t.time.split(':').map(Number);
              const todoMins = tHour * 60 + tMin;
              if (t.date === todayStr && near(todoMins, 2, 7)) {
                await sendAll(`📋 Task due now`, t.text, `todo-${t.id}`);
              }
            }
          })();
          SCRIPT
