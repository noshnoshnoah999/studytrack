name: Study Notifications

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test email now'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send study notifications
        env:
          VAPID_PUBLIC:  ${{ vars.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_EMAIL:   noah@flouty.uk
          SB_URL:        ${{ vars.SB_URL }}
          SB_KEY:        ${{ secrets.SB_KEY }}
          RESEND_KEY:    ${{ secrets.RESEND_KEY }}
          EMAIL_TO:      noah@flouty.uk
          TEST_EMAIL:    ${{ github.event.inputs.test_email }}
        run: |
          npm install --silent web-push
          node << 'SCRIPT'
          const webpush = require('web-push');

          const SB_URL = process.env.SB_URL;
          const SB_KEY = process.env.SB_KEY;
          const HDR = {
            'apikey': SB_KEY,
            'Authorization': 'Bearer ' + SB_KEY,
            'Content-Type': 'application/json'
          };

          webpush.setVapidDetails(
            'mailto:' + process.env.VAPID_EMAIL,
            process.env.VAPID_PUBLIC,
            process.env.VAPID_PRIVATE
          );

          // ── Supabase helpers ───────────────────────────────────────────────
          async function sbGet(key) {
            try {
              const r = await fetch(
                `${SB_URL}/rest/v1/study_data?key=eq.${key}&select=value`,
                { headers: HDR }
              );
              if (!r.ok) { console.error('sbGet ' + key + ' failed: ' + r.status); return null; }
              const rows = await r.json();
              if (!rows || !rows[0]) return null;
              const val = rows[0].value;
              if (typeof val === 'string') { try { return JSON.parse(val); } catch(e) { return val; } }
              return val;
            } catch(e) { console.error('sbGet error:', e.message); return null; }
          }

          async function sbSet(key, val) {
            try {
              await fetch(`${SB_URL}/rest/v1/study_data`, {
                method: 'POST',
                headers: { ...HDR, 'Prefer': 'resolution=merge-duplicates' },
                body: JSON.stringify({ key, value: val, updated_at: new Date().toISOString() })
              });
            } catch(e) {}
          }

          // ── Utilities ──────────────────────────────────────────────────────
          function toMins(t) {
            if (!t) return 0;
            const [h, m] = t.split(':');
            return parseInt(h) * 60 + parseInt(m || 0);
          }

          function fmtH(h) {
            const tot = Math.round(h * 60);
            const hrs = Math.floor(tot / 60);
            const mins = tot % 60;
            if (hrs && mins) return `${hrs}h ${mins}m`;
            if (hrs) return `${hrs}h`;
            return `${mins}m`;
          }

          // ── Send helper ────────────────────────────────────────────────────
          async function send(sub, title, body, tag, extra={}) {
            try {
              await webpush.sendNotification(sub, JSON.stringify({
                title, body, tag, url: '/studytrack/', sentAt: Date.now(), ...extra
              }));
              console.log(`[OK] [${tag}] ${title} - ${body}`);
            } catch(e) {
              if (e.statusCode === 410 || e.statusCode === 404) {
                console.log(`[GONE] subscription expired, skipping`);
              } else {
                console.error(`[ERR] [${tag}] ${e.statusCode || e.message}`);
              }
            }
          }

          // ── Main ───────────────────────────────────────────────────────────
          (async () => {
            // Current time in Tokyo (JST = UTC+9, no DST)
            // Use direct UTC offset math — avoids toLocaleString parsing bugs on Linux
            const nowDate = new Date(Date.now() + 9 * 3600000);
            const dow     = nowDate.getUTCDay();
            const nowMins = nowDate.getUTCHours() * 60 + nowDate.getUTCMinutes();
            const todayStr =
              nowDate.getUTCFullYear() + '-' +
              String(nowDate.getUTCMonth() + 1).padStart(2, '0') + '-' +
              String(nowDate.getUTCDate()).padStart(2, '0');
            const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            console.log(`${DAY[dow]} ${nowDate.getUTCHours()}:${String(nowDate.getUTCMinutes()).padStart(2,'0')} Tokyo | ${nowMins}m | ${todayStr}`);

            // Is current time within a window around target?
            // lo=0 by default: never fire BEFORE the target minute (the cron runs
            // every minute, so a slightly-early fire used to send at e.g. 6:59 for a
            // 7:00 notification). Window is [target, target+hi) — fires exactly on time.
            function near(targetMins, lo=0, hi=2) {
              return nowMins >= targetMins - lo && nowMins < targetMins + hi;
            }

            // Fetch everything in parallel
            const [schedule, subjectsRaw, sessionsRaw, hoursRaw, subsRaw, notifDone, todosRaw, overridesRaw, goalsRaw, templatesRaw, holidayRaw] = await Promise.all([
              sbGet('st_sched'),
              sbGet('st_subjs'),
              sbGet('st_sessions'),
              sbGet('st_hours'),
              sbGet('push_subscriptions'),
              sbGet('notif_done_subjs'),
              sbGet('st_todos'),
              sbGet('st_sched_overrides'),
              sbGet('st_goals'),
              sbGet('st_notif_templates'),
              sbGet('st_holiday'),
            ]);

            if (!subsRaw) { console.log('No push subscriptions found'); return; }
            const subs = Array.isArray(subsRaw) ? subsRaw : [subsRaw];
            console.log(`Sending to ${subs.length} device(s)`);

            // ── Holiday / pause-schedule mode ──────────────────────────────
            // When the user turns on holiday mode in the app, st_holiday is
            // {paused, until}. While active we suppress ALL reminders + emails
            // (auto-resuming once today is past the chosen return date).
            const onHoliday = !!(holidayRaw && holidayRaw.paused &&
              (!holidayRaw.until || todayStr <= holidayRaw.until));
            if (onHoliday) console.log(`Holiday mode ON${holidayRaw.until ? ' until ' + holidayRaw.until : ''} — suppressing all notifications`);

            // Helper: send to ALL subscribed devices (no-op while on holiday)
            async function sendAll(title, body, tag, extra={}) {
              if (onHoliday) return;
              for (const sub of subs) {
                await send(sub, title, body, tag, extra);
              }
            }

            // Per-day dedup: the cron runs every ~1 min, so each timed notification's
            // window (a few minutes wide) would otherwise re-send and re-buzz 2–3×.
            // notif_sent maps tag -> the date it last fired; sendOnce skips repeats today.
            const sentLog = (await sbGet('notif_sent')) || {};
            let sentChanged = false;
            async function sendOnce(title, body, tag, extra={}) {
              if (sentLog[tag] === todayStr) return; // already sent today
              await sendAll(title, body, tag, extra);
              sentLog[tag] = todayStr;
              sentChanged = true;
            }

            // ISO-week parity (0 = Week A / even, 1 = Week B / odd) — matches the app's getWeekParity
            function weekParity(y, m, d) {
              const dt = new Date(Date.UTC(y, m, d));
              dt.setUTCDate(dt.getUTCDate() + 4 - (dt.getUTCDay() || 7));
              const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
              return Math.ceil((((dt - yearStart) / 86400000) + 1) / 7) % 2;
            }
            const parity = weekParity(nowDate.getUTCFullYear(), nowDate.getUTCMonth(), nowDate.getUTCDate());

            // Use one-off override for today if it exists, otherwise the weekly schedule —
            // respecting each block's recurrence (weekly / biweekly_a / biweekly_b), same as the app.
            const overrides = overridesRaw || {};
            const hasOverride = !!overrides[todayStr];
            const todayBlocks = (hasOverride ? overrides[todayStr] : (schedule || []).filter(b => {
                if (b.day !== dow) return false;
                if (!b.recurrence || b.recurrence === 'weekly') return true;
                if (b.recurrence === 'biweekly_a') return parity === 0;
                if (b.recurrence === 'biweekly_b') return parity === 1;
                return true;
              }))
              .sort((a, b) => toMins(a.start) - toMins(b.start));
            console.log(`Schedule source: ${hasOverride ? 'override for ' + todayStr : 'weekly day ' + dow + ' Week ' + (parity===0?'A':'B')} | ${todayBlocks.length} blocks`);

            const subjects = subjectsRaw || [];
            const sessions = sessionsRaw || [];
            const hours    = hoursRaw    || {};

            // Helper: total logged for a subject
            function getLogged(id) {
              const s = subjects.find(x => x.id === id);
              if (!s) return 0;
              return (s.base || 0) + (hours[id] || 0);
            }

            // Today's total hours
            const todayH = sessions
              .filter(s => s.date === todayStr)
              .reduce((a, s) => a + s.hours, 0);

            // Weekly hours (last 7 days)
            const weekAgo = new Date(nowDate); weekAgo.setDate(weekAgo.getDate() - 6);
            const weekH = sessions
              .filter(s => new Date(s.date) >= weekAgo)
              .reduce((a, s) => a + s.hours, 0);

            // Weekly avg over last 4 weeks
            const monthAgo = new Date(nowDate); monthAgo.setDate(monthAgo.getDate() - 28);
            const monthH = sessions
              .filter(s => new Date(s.date) >= monthAgo)
              .reduce((a, s) => a + s.hours, 0);
            const weeklyAvg = monthH / 4;

            const dailyGoal  = (goalsRaw && goalsRaw.daily)  || 6.3;
            const weeklyGoal = (goalsRaw && goalsRaw.weekly) || 31.5;

            // ── Notification templates ────────────────────────────────────
            const DEFAULT_TPLS = {
              'block-soon':       {title:'Starting in 10min',            body:'{label} · {start}–{end}'},
              'block-start':      {title:'Time to study — {label}',      body:'{start}–{end} · Tap to start your timer'},
              'block-end':        {title:'{label} ending soon',          body:'Finishes at {end} · Don\'t forget to log your session!'},
              'break-end':        {title:'Break ending soon',            body:'Up next: {nextLabel} at {nextStart}'},
              'morning-empty':    {title:'Good morning!',                body:'No study blocks today — rest up!'},
              'morning-schedule': {title:'Good morning! {count} blocks today · {scheduledH}', body:'{blocks}'},
              'morning-focus':    {title:'Today: {subjects}',            body:'{focusBody}'},
              'wrapup-hit':       {title:'Daily wrap-up 🎯',             body:'Target hit! You studied {todayH} today'},
              'wrapup-miss':      {title:'Daily wrap-up',                body:'{todayH} logged · {remaining} to go'},
              'monday':           {title:'New week!',                    body:'Goal: {weeklyGoal} this week · You averaged {weeklyAvg}/week recently'},
              'weekly-recap':     {title:'Weekly recap',                 body:'{weekH} this week · {daysHit}/7 days hit target'},
              'subject-done':     {title:'Subject complete! 🎉',         body:'{name} is done · Great work!'},
              'subjects-behind':  {title:'Subjects falling behind',      body:'{subjects}'},
            };
            const TPLS = { ...DEFAULT_TPLS, ...(templatesRaw || {}) };

            // Fill {variable} placeholders in a template string
            function fill(str, vars) {
              return str.replace(/\{(\w+)\}/g, (_, k) => vars[k] !== undefined ? vars[k] : '{'+k+'}');
            }
            function tpl(id, vars) {
              const t = TPLS[id] || DEFAULT_TPLS[id] || { title: id, body: '' };
              return { title: fill(t.title, vars), body: fill(t.body, vars) };
            }

            // ── 1a. Block starting in ~10 min (9–11 min window) ───────────
            const startingSoon = todayBlocks.filter(b =>
              b.type === 'study' &&
              toMins(b.start) - nowMins >= 9 &&
              toMins(b.start) - nowMins <= 11
            );
            for (const bl of startingSoon) {
              const {title,body} = tpl('block-soon', {label:bl.label, start:bl.start, end:bl.end});
              await sendOnce(title, body, `soon-${bl.id}`);
            }

            // ── 1b. Block just started (0–2 min ago) — Start Timer ────────
            const justStarted = todayBlocks.filter(b =>
              b.type === 'study' &&
              nowMins >= toMins(b.start) &&
              nowMins < toMins(b.start) + 2
            );
            for (const bl of justStarted) {
              const {title,body} = tpl('block-start', {label:bl.label, start:bl.start, end:bl.end});
              await sendOnce(title, body, `started-${bl.id}`,
                { type: 'block-start', subjectId: bl.subjectId || null, blockStart: bl.start });
            }

            // ── 2. Study block ending in ~5 min (4–6 min window) ─────────
            const endingSoon = todayBlocks.filter(b =>
              b.type === 'study' &&
              toMins(b.end) - nowMins >= 4 &&
              toMins(b.end) - nowMins <= 6
            );
            for (const bl of endingSoon) {
              const {title,body} = tpl('block-end', {label:bl.label, end:bl.end});
              await sendOnce(title, body, `end-${bl.id}`,
                { type: 'block-end', subjectId: bl.subjectId || null, blockStart: bl.start });
            }

            // ── 3. Break ending in 0–2 min — next block preview ──────────
            const breakEndingSoon = todayBlocks.filter(b =>
              b.type === 'break' &&
              toMins(b.end) - nowMins >= 0 &&
              toMins(b.end) - nowMins <= 2
            );
            for (const bl of breakEndingSoon) {
              const nextBlock = todayBlocks.find(b => toMins(b.start) >= toMins(bl.end) && b.type === 'study');
              const {title,body} = tpl('break-end', {
                nextLabel: nextBlock ? nextBlock.label : 'next block',
                nextStart: nextBlock ? nextBlock.start : ''
              });
              await sendOnce(title, body, `break-end-${bl.id}`);
            }

            // ── 4. Morning summary — 8:30am ───────────────────────────────
            if (near(8 * 60 + 30)) {
              const studyBlocks = todayBlocks.filter(b => b.type === 'study');
              const scheduledH  = studyBlocks.reduce((a, b) => a + (toMins(b.end) - toMins(b.start)) / 60, 0);

              if (studyBlocks.length === 0) {
                const {title,body} = tpl('morning-empty', {});
                await sendOnce(title, body, 'morning-summary');
              } else {
                const blocks = studyBlocks.map(b => `${b.start}–${b.end} ${b.label}`).join('\n');
                const {title,body} = tpl('morning-schedule', {
                  count: studyBlocks.length, scheduledH: fmtH(scheduledH), blocks
                });
                await sendOnce(title, body, 'morning-schedule');

                const subjectStats = subjects
                  .filter(s => !s.done && !s.passive && s.req > 0)
                  .map(s => {
                    const logged = getLogged(s.id);
                    const pct = logged / s.req * 100;
                    const left = Math.max(0, s.req - logged);
                    return { ...s, logged, pct, left };
                  })
                  .sort((a, b) => a.pct - b.pct);

                const top3 = subjectStats.slice(0, 3);
                const focusBody = top3.map(s => `${s.name} · ${Math.round(s.pct)}% · ${fmtH(s.left)} left`).join('\n');
                const todaySubjectIds = studyBlocks.map(b => b.subjectId).filter(Boolean);
                const todayScheduled  = subjectStats.filter(s => todaySubjectIds.includes(s.id)).map(s => s.name);
                const subjects_str = todayScheduled.length ? todayScheduled.join(', ') : 'Most behind subjects';
                const {title:ft, body:fb} = tpl('morning-focus', {subjects: subjects_str, focusBody});
                await sendOnce(ft, fb, 'morning-focus');
              }
            }

            // ── 5. Daily wrap-up — 6pm ────────────────────────────────────
            if (near(18 * 60)) {
              const remaining = Math.max(0, dailyGoal - todayH);
              const id = todayH >= dailyGoal ? 'wrapup-hit' : 'wrapup-miss';
              const {title,body} = tpl(id, {todayH: fmtH(todayH), remaining: fmtH(remaining)});
              await sendOnce(title, body, 'daily-wrapup');
            }

            // ── 6. Monday morning — weekly preview ────────────────────────
            if (dow === 1 && near(8 * 60)) {
              const {title,body} = tpl('monday', {
                weeklyGoal: fmtH(weeklyGoal), weeklyAvg: fmtH(weeklyAvg)
              });
              await sendOnce(title, body, 'monday-preview');
            }

            // ── 7. Sunday evening — weekly recap ─────────────────────────
            if (dow === 0 && near(18 * 60)) {
              const hitTarget = sessions
                .filter(s => new Date(s.date) >= weekAgo && new Date(s.date) <= nowDate)
                .reduce((map, s) => { map[s.date] = (map[s.date] || 0) + s.hours; return map; }, {});
              const daysHit = Object.values(hitTarget).filter(h => h >= dailyGoal).length;
              const {title,body} = tpl('weekly-recap', {weekH: fmtH(weekH), daysHit});
              await sendOnce(title, body, 'weekly-recap');
            }

            // ── 8. Subject complete — first time only ─────────────────────
            const alreadyNotified = notifDone || [];
            const newlyDone = subjects.filter(s => s.done && !alreadyNotified.includes(s.id));
            for (const s of newlyDone) {
              const {title,body} = tpl('subject-done', {name: s.name});
              await sendAll(title, body, `done-${s.id}`);
            }
            if (newlyDone.length) {
              await sbSet('notif_done_subjs', [...alreadyNotified, ...newlyDone.map(s => s.id)]);
            }

            // ── 9. Subjects falling behind — 9am ─────────────────────────
            if (near(9 * 60)) {
              const avgPct = subjects
                .filter(s => !s.done && s.req > 0)
                .reduce((a, s) => a + getLogged(s.id) / s.req, 0) /
                Math.max(1, subjects.filter(s => !s.done && s.req > 0).length) * 100;

              const wayBehind = subjects
                .filter(s => !s.done && !s.passive && s.req > 0)
                .map(s => ({ ...s, pct: getLogged(s.id) / s.req * 100 }))
                .filter(s => s.pct < avgPct - 15)
                .sort((a, b) => a.pct - b.pct)
                .slice(0, 3);

              if (wayBehind.length) {
                const {title,body} = tpl('subjects-behind', {
                  subjects: wayBehind.map(s => `${s.name} (${Math.round(s.pct)}%)`).join(' · ')
                });
                await sendOnce(title, body, 'behind-subjects');
              }
            }

            // ── 10. To-Do reminders ───────────────────────────────────────
            const todos = todosRaw || [];
            for (const t of todos.filter(t => !t.done && t.date && t.time)) {
              const todoMins = toMins(t.time);
              if (t.date === todayStr && near(todoMins, 2, 7)) {
                await sendOnce('Task due now', t.text, `todo-${t.id}`,
                  { type: 'todo', todoId: t.id });
              }
            }

            // Persist the dedup log so repeat runs today don't re-buzz
            if (sentChanged) await sbSet('notif_sent', sentLog);

            // ════════════════ EMAIL DIGESTS (Resend) ════════════════
            // Sent to EMAIL_TO via Resend. Skips silently if RESEND_KEY isn't set.
            try {
              const RESEND_KEY = process.env.RESEND_KEY;
              const EMAIL_TO = process.env.EMAIL_TO || 'noah@flouty.uk';
              // Holiday mode suppresses scheduled digests, but a manually
              // triggered test email still goes through.
              if (RESEND_KEY && (!onHoliday || process.env.TEST_EMAIL === 'true')) {
                const emailLog = (await sbGet('email_sent')) || {};
                let emailChanged = false;
                async function sendEmail(subject, html) {
                  try {
                    const r = await fetch('https://api.resend.com/emails', {
                      method: 'POST',
                      headers: { 'Authorization': 'Bearer ' + RESEND_KEY, 'Content-Type': 'application/json' },
                      body: JSON.stringify({ from: 'StudyTrack <onboarding@resend.dev>', to: [EMAIL_TO], subject, html })
                    });
                    if (!r.ok) { console.error('[EMAIL] failed ' + r.status + ': ' + (await r.text())); return false; }
                    console.log('[EMAIL] sent: ' + subject); return true;
                  } catch(e) { console.error('[EMAIL] error: ' + e.message); return false; }
                }
                async function emailOnce(tag, subject, html) {
                  if (emailLog[tag] === todayStr) return;
                  if (await sendEmail(subject, html)) { emailLog[tag] = todayStr; emailChanged = true; }
                }

                // ── Shared stats (graduation excludes extra-credit subjects) ──
                const ecIds = new Set(subjects.filter(s => s.extraCredit).map(s => s.id)); ecIds.add('el4');
                const gradSubjs = subjects.filter(s => !ecIds.has(s.id));
                const TOTAL_REQ = gradSubjs.reduce((a, s) => a + (s.req || 0), 0);
                const totalLogged = gradSubjs.reduce((a, s) => a + getLogged(s.id), 0);
                const remaining = Math.max(0, TOTAL_REQ - totalLogged);
                const overallPct = TOTAL_REQ > 0 ? (totalLogged / TOTAL_REQ * 100) : 0;
                const cut28 = new Date(nowDate); cut28.setUTCDate(cut28.getUTCDate() - 28);
                const cut28Str = cut28.getUTCFullYear()+'-'+String(cut28.getUTCMonth()+1).padStart(2,'0')+'-'+String(cut28.getUTCDate()).padStart(2,'0');
                const recentH = sessions.filter(s => s.date >= cut28Str && !ecIds.has(s.subjectId)).reduce((a, s) => a + s.hours, 0);
                const pace = recentH >= 3 ? recentH / 4 : weeklyGoal;
                const deadline = new Date(Date.UTC(2027, 9, 31));
                const weeksToDeadline = Math.max(0, (deadline - nowDate) / (1000*60*60*24*7));
                const neededPace = weeksToDeadline > 0.1 ? remaining / weeksToDeadline : remaining;
                const weeksLeft = pace > 0 ? remaining / pace : 999;
                const estDate = new Date(nowDate); estDate.setUTCDate(estDate.getUTCDate() + Math.round(weeksLeft * 7));
                const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                const estStr = MON[estDate.getUTCMonth()] + ' ' + estDate.getUTCFullYear();
                const onTrack = estDate <= deadline;
                const stats = gradSubjs.filter(s => !s.done && s.req > 0)
                  .map(s => { const lg = getLogged(s.id); return { name: s.name, pct: lg/s.req*100, left: Math.max(0, s.req - lg) }; })
                  .sort((a, b) => a.pct - b.pct);

                // ── HTML helpers — mocha theme, inline styles for email clients ──
                const C = { bg:'#efe7da', panel:'#fffdf9', card:'#f6efe3', o:'#6f4e37', text:'#3a2a1e', text2:'#8a7561', ok:'#5f7a54', err:'#b06a4e', border:'#e7dbc9' };
                function wrap(title, sub, inner) {
                  return `<div style="margin:0;padding:0;background:${C.bg}"><div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:${C.bg};padding:32px 16px"><div style="max-width:540px;margin:0 auto"><div style="text-align:center;margin-bottom:18px"><span style="font-size:13px;font-weight:700;letter-spacing:5px;color:${C.o};text-transform:uppercase">STUDYTRACK</span></div><div style="background:${C.panel};border-radius:22px;border:1px solid ${C.border};overflow:hidden"><div style="padding:30px 32px 0"><div style="width:34px;height:3px;background:${C.o};border-radius:100px;margin-bottom:18px"></div><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:${C.text2};text-transform:uppercase">${title}${sub ? ' &middot; ' + sub : ''}</div></div><div style="padding:18px 32px 32px">${inner}</div></div><div style="text-align:center;padding:22px 0 6px;color:${C.text2};font-size:11px;letter-spacing:0.3px">${todayStr} &middot; Tokyo &nbsp;&middot;&nbsp; <a href="https://noshnoshnoah999.github.io/studytrack/" style="color:${C.o};text-decoration:none;font-weight:600">Open StudyTrack &rarr;</a></div></div></div></div>`;
                }
                function stat(label, value, color) {
                  return `<td style="width:33.3%;padding:0 4px"><div style="background:${C.card};border:1px solid ${C.border};border-radius:16px;padding:18px 8px;text-align:center"><div style="font-size:24px;font-weight:700;color:${color||C.text};letter-spacing:-0.6px;line-height:1">${value}</div><div style="font-size:9px;font-weight:700;letter-spacing:1px;color:${C.text2};margin-top:7px;text-transform:uppercase">${label}</div></div></td>`;
                }
                function bar(pct, color) {
                  const w = Math.min(100, Math.max(0, pct));
                  return `<div style="background:${C.border};border-radius:100px;height:6px;overflow:hidden"><div style="background:${color||C.o};height:6px;width:${w}%;border-radius:100px"></div></div>`;
                }
                const heading = (t) => `<div style="font-size:10px;font-weight:700;color:${C.text2};text-transform:uppercase;letter-spacing:1.5px;margin:24px 0 12px">${t}</div>`;

                // ── TEST EMAIL — fired on demand via workflow_dispatch ──
                if (process.env.TEST_EMAIL === 'true') {
                  let inner = `<div style="font-size:15px;color:${C.text};margin-bottom:16px">✅ Your email digests are working! This is a live test.</div>`;
                  inner += `<table style="width:100%;border-collapse:separate;border-spacing:0;margin-bottom:8px"><tr>${stat('Logged', fmtH(totalLogged), C.o)}${stat('Remaining', fmtH(remaining), C.text)}${stat('Complete', Math.round(overallPct)+'%', C.text)}</tr></table>`;
                  inner += `<div style="margin:14px 0">${bar(overallPct)}</div>`;
                  inner += `<div style="padding:14px;background:${C.card};border-radius:10px;font-size:14px;color:${C.text};line-height:1.5">At your recent pace (${fmtH(pace)}/wk) you'll finish around <strong style="color:${onTrack?C.ok:C.err}">${estStr}</strong>. You'll now get daily, weekly and monthly digests automatically.</div>`;
                  await sendEmail('✅ StudyTrack email test', wrap('Email test', null, inner));
                }

                // ── 1. DAILY SUMMARY — 7:00 AM Tokyo ──
                if (near(7 * 60)) {
                  const studyBlocks = todayBlocks.filter(b => b.type === 'study');
                  const yest = new Date(nowDate); yest.setUTCDate(yest.getUTCDate() - 1);
                  const yestStr = yest.getUTCFullYear()+'-'+String(yest.getUTCMonth()+1).padStart(2,'0')+'-'+String(yest.getUTCDate()).padStart(2,'0');
                  const yestH = sessions.filter(s => s.date === yestStr && !ecIds.has(s.subjectId)).reduce((a,s)=>a+s.hours, 0);
                  const dueToday = (todosRaw||[]).filter(t => !t.done && t.date === todayStr);
                  let inner = `<div style="font-size:16px;color:${C.text};margin-bottom:18px;font-weight:500">Good morning, Noah</div>`;
                  inner += `<table style="width:100%;border-collapse:separate;border-spacing:0;margin-bottom:6px"><tr>${stat('Yesterday', fmtH(yestH), yestH>=dailyGoal?C.ok:C.text)}${stat('This week', fmtH(weekH), C.o)}${stat("Today's goal", fmtH(dailyGoal), C.text)}</tr></table>`;
                  if (studyBlocks.length) {
                    inner += heading("Today's schedule");
                    inner += studyBlocks.map(b => `<div style="display:flex;justify-content:space-between;padding:9px 12px;background:${C.card};border-radius:9px;margin-bottom:5px;font-size:14px"><span style="color:${C.text};font-weight:600">${b.label}</span><span style="color:${C.text2}">${b.start}–${b.end}</span></div>`).join('');
                  } else {
                    inner += `<div style="margin-top:14px;padding:12px;background:${C.card};border-radius:9px;color:${C.text2};font-size:14px">No study blocks today — rest up! 🌿</div>`;
                  }
                  if (stats.length) {
                    inner += heading('Most behind');
                    inner += stats.slice(0,3).map(s => `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="color:${C.text};font-weight:600">${s.name}</span><span style="color:${C.text2}">${Math.round(s.pct)}% · ${fmtH(s.left)} left</span></div>${bar(s.pct)}</div>`).join('');
                  }
                  if (dueToday.length) {
                    inner += heading('Tasks due today');
                    inner += dueToday.map(t => `<div style="font-size:14px;color:${C.text};padding:5px 0">☐ ${t.text}${t.time ? ' · ' + t.time : ''}</div>`).join('');
                  }
                  await emailOnce('email-daily', `☀️ ${todayStr} · ${studyBlocks.length} block${studyBlocks.length!==1?'s':''} today`, wrap('Daily summary', DAY[dow], inner));
                }

                // ── 2. WEEKLY RECAP — Sunday 18:00 Tokyo ──
                if (dow === 0 && near(18 * 60)) {
                  const dayMap = {};
                  sessions.filter(s => new Date(s.date) >= weekAgo && new Date(s.date) <= nowDate && !ecIds.has(s.subjectId)).forEach(s => { dayMap[s.date] = (dayMap[s.date]||0) + s.hours; });
                  const daysHit = Object.values(dayMap).filter(h => h >= dailyGoal).length;
                  let inner = `<div style="font-size:16px;color:${C.text};margin-bottom:18px;font-weight:500">Here's how your week went</div>`;
                  inner += `<table style="width:100%;border-collapse:separate;border-spacing:0;margin-bottom:14px"><tr>${stat('This week', fmtH(weekH), C.o)}${stat('Goal', fmtH(weeklyGoal), C.text)}${stat('Days hit', daysHit + '/7', daysHit>=5?C.ok:C.text)}</tr></table>`;
                  inner += `<div style="font-size:12px;color:${C.text2};margin-bottom:6px">Weekly goal progress</div>${bar(weekH/weeklyGoal*100, weekH>=weeklyGoal?C.ok:C.o)}`;
                  inner += `<div style="margin-top:18px;padding:16px;background:${C.card};border:1px solid ${C.border};border-radius:12px;font-size:14px;color:${C.text};line-height:1.55"><strong>Graduation:</strong> at your recent pace (${fmtH(pace)}/wk) you'll finish around <strong style="color:${onTrack?C.ok:C.err}">${estStr}</strong> — ${onTrack ? 'before' : 'after'} the Oct 2027 deadline.</div>`;
                  await emailOnce('email-weekly', `📆 Weekly recap · ${fmtH(weekH)} · ${daysHit}/7 days hit`, wrap('Weekly recap', null, inner));
                }

                // ── 3. GRADUATION REPORT — 1st of month, 8:00 AM Tokyo ──
                if (nowDate.getUTCDate() === 1 && near(8 * 60)) {
                  let inner = `<div style="font-size:16px;color:${C.text};margin-bottom:18px;font-weight:500">Your monthly progress report</div>`;
                  inner += `<table style="width:100%;border-collapse:separate;border-spacing:0;margin-bottom:8px"><tr>${stat('Logged', fmtH(totalLogged), C.o)}${stat('Remaining', fmtH(remaining), C.text)}${stat('Complete', Math.round(overallPct)+'%', C.text)}</tr></table>`;
                  inner += `<div style="margin:14px 0">${bar(overallPct)}</div>`;
                  inner += `<div style="padding:16px;background:${C.card};border:1px solid ${C.border};border-radius:12px;font-size:14px;color:${C.text};margin-bottom:6px;line-height:1.55"><strong style="color:${onTrack?C.ok:C.err}">${onTrack?'On track':'Behind'}</strong> — projected finish <strong>${estStr}</strong> at ${fmtH(pace)}/wk.${!onTrack ? ` You need <strong>${fmtH(neededPace)}/wk</strong> to graduate on time.` : ''}</div>`;
                  inner += heading('Subjects in progress');
                  inner += stats.map(s => `<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="color:${C.text};font-weight:600">${s.name}</span><span style="color:${C.text2}">${Math.round(s.pct)}% · ${fmtH(s.left)} left</span></div>${bar(s.pct)}</div>`).join('');
                  const doneCount = gradSubjs.filter(s => s.done || getLogged(s.id) >= s.req).length;
                  inner += `<div style="margin-top:16px;font-size:13px;color:${C.text2}">${doneCount}/${gradSubjs.length} subjects complete.</div>`;
                  await emailOnce('email-grad', `🎓 Monthly report · ${Math.round(overallPct)}% · finish ${estStr}`, wrap('Graduation report', MON[nowDate.getUTCMonth()] + ' ' + nowDate.getUTCFullYear(), inner));
                }

                // ── 4. BEHIND-SCHEDULE ALERT — Wednesday 9:00 AM Tokyo ──
                if (dow === 3 && near(9 * 60)) {
                  const avgPct = stats.length ? stats.reduce((a, s) => a + s.pct, 0) / stats.length : 0;
                  const behind = stats.filter(s => s.pct < avgPct - 15).slice(0, 5);
                  if (behind.length) {
                    let inner = `<div style="font-size:16px;color:${C.text};margin-bottom:8px;font-weight:500">A few subjects need attention</div>`;
                    inner += `<div style="font-size:13px;color:${C.text2};margin-bottom:16px;line-height:1.5">These are falling behind your average pace. A little extra time this week keeps your Oct 2027 goal on track.</div>`;
                    inner += behind.map(s => `<div style="margin-bottom:12px;padding:12px;background:${C.card};border-radius:10px"><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span style="color:${C.text};font-weight:700">${s.name}</span><span style="color:${C.err};font-weight:600">${Math.round(s.pct)}%</span></div>${bar(s.pct, C.err)}<div style="font-size:12px;color:${C.text2};margin-top:6px">${fmtH(s.left)} left</div></div>`).join('');
                    await emailOnce('email-behind', `⚠️ ${behind.length} subject${behind.length!==1?'s':''} falling behind`, wrap('Behind-schedule alert', null, inner));
                  }
                }

                if (emailChanged) await sbSet('email_sent', emailLog);
              }
            } catch(e) { console.error('[EMAIL] block error: ' + e.message); }
          })();
          SCRIPT
