name: Study Notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send upcoming study block notifications
        env:
          VAPID_PUBLIC:  ${{ vars.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_EMAIL:   noah@flouty.uk
          SB_URL:        ${{ vars.SB_URL }}
          SB_KEY:        ${{ secrets.SB_KEY }}
        run: |
          npm install --silent web-push
          node << 'EOF'
          const webpush = require('web-push');
          const SB_URL  = process.env.SB_URL;
          const SB_KEY  = process.env.SB_KEY;
          const HDR = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
          webpush.setVapidDetails('mailto:'+process.env.VAPID_EMAIL,process.env.VAPID_PUBLIC,process.env.VAPID_PRIVATE);
          async function sbGet(key){const r=await fetch(`${SB_URL}/rest/v1/study_data?key=eq.${key}&select=value`,{headers:HDR});if(!r.ok)return null;const rows=await r.json();return rows&&rows[0]?JSON.parse(rows[0].value):null;}
          function toMins(t){if(!t)return 0;const[h,m]=t.split(':');return parseInt(h)*60+parseInt(m||0);}
          (async()=>{
            const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Australia/Perth'}));
            const dow=now.getDay();const nowMins=now.getHours()*60+now.getMinutes();
            console.log(`${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow]} ${now.toLocaleTimeString()} (${nowMins}m)`);
            const[schedule,subRaw]=await Promise.all([sbGet('st_sched'),sbGet('push_subscription')]);
            if(!schedule){console.log('No schedule');return;}if(!subRaw){console.log('No subscription');return;}
            const sub=typeof subRaw==='string'?JSON.parse(subRaw):subRaw;
            const upcoming=schedule.filter(b=>b.day===dow&&b.type==='study'&&toMins(b.start)-nowMins>=2&&toMins(b.start)-nowMins<=12);
            console.log(`Upcoming: ${upcoming.length}`);
            for(const bl of upcoming){const minsAway=toMins(bl.start)-nowMins;try{await webpush.sendNotification(sub,JSON.stringify({title:minsAway<=5?'⏰ Starting in '+minsAway+'min':'📚 Coming up soon',body:bl.label+' · '+bl.start+'–'+bl.end,tag:'study-'+bl.id,url:'/studytrack/'}));console.log('Sent:',bl.label);}catch(e){console.error('Failed:',e.statusCode||e.message);}}
          })();
          EOF
